name: macOS arm64 Experimental CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/macos-arm64-ci.yml"
      - "editor/**"
      - "runtime/**"
      - "shared/**"
      - "licensing/**"
      - "tools/check_macos_arm64_ci_smoke.py"
      - "tools/build_macos_experimental.py"
      - "tools/macos_ci_bundle_probe.py"
      - "tools/macos_ci_launch_probe.py"
      - "tools/macos_ci_report.py"
      - "docs/macos-arm64-ci-bootstrap.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/macos-arm64-ci.yml"
      - "editor/**"
      - "runtime/**"
      - "shared/**"
      - "licensing/**"
      - "tools/check_macos_arm64_ci_smoke.py"
      - "tools/build_macos_experimental.py"
      - "tools/macos_ci_bundle_probe.py"
      - "tools/macos_ci_launch_probe.py"
      - "tools/macos_ci_report.py"
      - "docs/macos-arm64-ci-bootstrap.md"

permissions:
  contents: read

jobs:
  experimental-macos-arm64:
    name: Experimental macOS arm64 source and bundle evidence
    runs-on: macos-15
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      LAUNCHFLOW_DATA_DIR: ${{ runner.temp }}/launchflow-data
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/launchflow-pycache
      CI_EVIDENCE_DIR: ${{ runner.temp }}/launchflow-evidence
      CI_BUILD_DIR: ${{ runner.temp }}/launchflow-build
      CI_DIST_DIR: ${{ runner.temp }}/launchflow-dist
      CI_SPEC_DIR: ${{ runner.temp }}/launchflow-spec
      CI_ARTIFACT_DIR: ${{ runner.temp }}/launchflow-artifacts
      CI_UPLOAD_DIR: ${{ runner.temp }}/launchflow-upload
      LAUNCHFLOW_CI_SKIP_CONTRACT: real-hwid,request-generation,license-signing,private-key,windows-release,exe-export

    steps:
      - name: Checkout source read-only
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Prepare isolated temporary directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            "$LAUNCHFLOW_DATA_DIR" \
            "$CI_EVIDENCE_DIR" \
            "$CI_BUILD_DIR" \
            "$CI_DIST_DIR" \
            "$CI_SPEC_DIR" \
            "$CI_ARTIFACT_DIR" \
            "$CI_UPLOAD_DIR"
          printf '%s\n' \
            'workspace=$GITHUB_WORKSPACE' \
            'runtime_data=$RUNNER_TEMP/launchflow-data' \
            'build_root=$RUNNER_TEMP/launchflow-build' \
            'dist_root=$RUNNER_TEMP/launchflow-dist' \
            'spec_root=$RUNNER_TEMP/launchflow-spec' \
            'evidence_root=$RUNNER_TEMP/launchflow-evidence'

      - name: Verify Darwin arm64 runner
        shell: bash
        run: |
          set -euo pipefail
          system="$(uname -s)"
          machine="$(uname -m)"
          test "$system" = "Darwin"
          test "$machine" = "arm64"
          printf 'uname_s=%s\nuname_m=%s\n' "$system" "$machine"
          sw_vers -productName
          sw_vers -productVersion
          sw_vers -buildVersion
          system_profiler SPHardwareDataType | awk -F': ' '/^[[:space:]]*(Chip|Processor Name|Total Number of Cores):/ {gsub(/^[[:space:]]+/, "", $1); print $1 "=" $2}'
          python - <<'PY'
          import os
          import platform
          import sys
          import sysconfig

          executable = os.path.realpath(sys.executable)
          for variable in ("GITHUB_WORKSPACE", "RUNNER_TEMP", "RUNNER_TOOL_CACHE", "HOME"):
              source = os.environ.get(variable, "")
              if source and executable.startswith(source):
                  executable = "$" + variable + executable[len(source):]
                  break
          print("python_executable=" + executable)
          print("python_version=" + platform.python_version())
          print("platform_machine=" + platform.machine())
          print("sysconfig_platform=" + sysconfig.get_platform())
          print("git_commit=" + os.environ["GITHUB_SHA"])
          if platform.system() != "Darwin" or platform.machine() != "arm64":
              raise SystemExit("runner architecture gate failed")
          PY

      - name: Install pinned experimental dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input --no-cache-dir \
            "PySide6==6.9.3" \
            "PyInstaller==6.20.0" \
            "cryptography==46.0.3"
          python - <<'PY' | tee "$CI_EVIDENCE_DIR/dependency-versions.txt"
          from importlib.metadata import version

          expected = {
              "PySide6": "6.9.3",
              "PyInstaller": "6.20.0",
              "cryptography": "46.0.3",
          }
          for package, wanted in expected.items():
              actual = version(package)
              print(f"{package}=={actual}")
              if actual != wanted:
                  raise SystemExit(f"unexpected {package} version")
          PY

      - name: Compile and statically audit CI tools
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/check_macos_arm64_ci_smoke.py \
            tools/build_macos_experimental.py \
            tools/macos_ci_bundle_probe.py \
            tools/macos_ci_launch_probe.py \
            tools/macos_ci_report.py
          python tools/check_macos_arm64_ci_smoke.py --static-only

      - name: Run isolated source and offscreen smoke
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_macos_arm64_ci_smoke.py \
            --full \
            --evidence-dir "$CI_EVIDENCE_DIR" \
            --report "$CI_EVIDENCE_DIR/smoke-report.json"

      - name: Run safe repository gates
        shell: bash
        run: |
          set -euo pipefail
          python tools/macos_ci_report.py coupling \
            --checker tools/check_platform_coupling_smoke.py \
            --output "$CI_EVIDENCE_DIR/platform-coupling.json"
          python tools/check_readme_docs_smoke.py

      - name: Build unsigned non-production app bundle
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_macos_experimental.py \
            --work-path "$CI_BUILD_DIR" \
            --dist-path "$CI_DIST_DIR" \
            --spec-path "$CI_SPEC_DIR" \
            --result-json "$CI_EVIDENCE_DIR/build-result.json"

      - name: Inspect app bundle without key or license access
        shell: bash
        run: |
          set -euo pipefail
          python tools/macos_ci_bundle_probe.py \
            --app "$CI_DIST_DIR/LaunchFlow.app" \
            --report "$CI_EVIDENCE_DIR/bundle-report.json"

      - name: Probe bundle launch boundary
        shell: bash
        run: |
          set -euo pipefail
          python tools/macos_ci_launch_probe.py \
            --app "$CI_DIST_DIR/LaunchFlow.app" \
            --source-root "$GITHUB_WORKSPACE" \
            --data-dir "$RUNNER_TEMP/launchflow-bundle-data" \
            --report "$CI_EVIDENCE_DIR/launch-report.json" \
            --stdout-log "$CI_EVIDENCE_DIR/launch-stdout.log" \
            --stderr-log "$CI_EVIDENCE_DIR/launch-stderr.log"

      - name: Verify repository stayed read-only
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet -- \
            editor runtime licensing shared tools/build_editor_release.py \
            tools/build_single_exe.py assets README.md README_EN.md
          test -z "$(git status --porcelain --untracked-files=all -- \
            editor runtime licensing shared assets build dist releases README.md README_EN.md)"

      - name: Archive unsigned experimental app
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            "$CI_DIST_DIR/LaunchFlow.app" \
            "$CI_ARTIFACT_DIR/LaunchFlow-macos-arm64-experimental-unsigned.zip"

      - name: Scan explicit upload allowlist
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python tools/macos_ci_report.py scan-upload \
            --evidence-dir "$CI_EVIDENCE_DIR" \
            --archive "$CI_ARTIFACT_DIR/LaunchFlow-macos-arm64-experimental-unsigned.zip" \
            --output-dir "$CI_UPLOAD_DIR"

      - name: Upload experimental evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launchflow-macos-arm64-experimental
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/launchflow-upload/LaunchFlow-macos-arm64-experimental-unsigned.zip
            ${{ runner.temp }}/launchflow-upload/build-log.txt
            ${{ runner.temp }}/launchflow-upload/build-result.json
            ${{ runner.temp }}/launchflow-upload/bundle-report.json
            ${{ runner.temp }}/launchflow-upload/smoke-report.json
            ${{ runner.temp }}/launchflow-upload/launch-report.json
            ${{ runner.temp }}/launchflow-upload/launch-stdout.log
            ${{ runner.temp }}/launchflow-upload/launch-stderr.log
            ${{ runner.temp }}/launchflow-upload/gui-main-window.png
            ${{ runner.temp }}/launchflow-upload/dependency-versions.txt
            ${{ runner.temp }}/launchflow-upload/platform-coupling.json
            ${{ runner.temp }}/launchflow-upload/upload-scan.json
